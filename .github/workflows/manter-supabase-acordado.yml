# Keeps the Supabase project awake on the free plan, which pauses a project after a week without requests.
# Once a day it reads one row of a public table (competitions), as the app does without an account. Free on GitHub.
# Needs two repository secrets: SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (the same public values the app ships).
name: Manter o Supabase acordado

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# It only reads a public row: no access to the repository is needed.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ler uma linha pública
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/competition?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase respondeu $code"
          test "$code" = "200"
