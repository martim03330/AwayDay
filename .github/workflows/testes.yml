# Runs every check that needs no database on each push: types, lint, logic tests and screen tests. The SQL tests stay
# local (npm run test:sql), because they run against the production project. GitHub emails the owner when it fails.
name: Testes

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
