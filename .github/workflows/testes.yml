# Runs on each push: types, lint, logic tests and screen tests (check), and the SQL tests (sql) against a Supabase
# created from scratch inside the runner, with the migrations and the seed: never against production.
# GitHub emails the owner when it fails.
name: Testes

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Supabase local com as migrações e a seed
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Testes de SQL
        run: SQL_ALVO=--local sh scripts/testes/sql.sh
