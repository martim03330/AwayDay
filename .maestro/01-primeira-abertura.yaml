# Jornada 1 — primeira vez, sem conta: boas-vindas → «Espreitar sem conta» → clube → avisos → tabs.
# Corre duas vezes a introdução: uma com «Agora não», outra com «Ligar avisos».
appId: host.exp.Exponent
name: 01 Primeira abertura sem conta
tags: [sem-conta]
---
- runFlow: comum/boas-vindas.yaml

# Boas-vindas
- assertVisible: "Vamos à bola\\?"
- assertVisible: "Criar conta"
- assertVisible: "Já tenho conta"
- assertVisible: "Espreitar sem conta"
- assertVisible: "Termos"
- assertVisible: "Privacidade"
- tapOn: "Espreitar sem conta"

# Clube: sem escolha, o botão está desligado e não avança
- extendedWaitUntil:
    visible: "Primeiro o mais importante: de que clube és\\?"
    timeout: 10000
- assertVisible: "Passo 1 de 2"
- assertVisible: "Faço isto depois"
# Na primeira abertura nada vem escolhido e o botão não avança. (Se a introdução já foi vista neste Expo Go, vem
# marcada a escolha anterior: o AsyncStorage do Expo Go não se limpa a partir do Maestro.)
- runFlow:
    when:
      visible: "Escolhe o teu clube"
    commands:
      - tapOn: "Escolhe o teu clube"
      - assertVisible: "Primeiro o mais importante: de que clube és\\?"
      - assertVisible: "Escolhe o teu clube"
- scrollUntilVisible:
    element: "Sporting(,.*)?"
    direction: DOWN
    timeout: 30000
- tapOn: "Sporting(,.*)?"
- assertVisible: "Continuar com Sporting"
- tapOn: "Continuar com Sporting"

# Avisos: sem conta só aparecem os avisos dos jogos
- extendedWaitUntil:
    visible: "Queres saber o que mexe nos teus jogos\\?"
    timeout: 10000
- assertVisible: "Passo 2 de 2"
- assertVisible: "Os teus jogos"
- assertNotVisible: "As tuas boleias"
- assertNotVisible: "A tua malta"
- assertVisible: "Só isto, nada de publicidade.*"
- tapOn: "Agora não"

# Tabs, com o clube escolhido
- extendedWaitUntil:
    visible: "Tab Bar"
    timeout: 15000
- assertVisible: "Malta"
- assertVisible: "Ranking"
- assertVisible: "Perfil"
- assertNotVisible: "Modo demo ligado: estás a ver dados de exemplo"
- assertVisible: "(.*contra Sporting|Sporting contra ).*|Sporting não joga nos próximos dias\\."

# Segunda vez: rever a introdução, a escolha do clube vem marcada, e «Ligar avisos»
- runFlow: { file: comum/abrir.yaml, env: { ROTA: /perfil/definicoes } }
- tapOn: "Rever a introdução"
- extendedWaitUntil:
    visible: "Vamos à bola\\?"
    timeout: 10000
- tapOn: "Espreitar sem conta"
- extendedWaitUntil:
    visible: "Continuar com Sporting"
    timeout: 10000
- tapOn: "Faço isto depois"
- extendedWaitUntil:
    visible: "Ligar avisos"
    timeout: 10000
- tapOn: "Ligar avisos"
# iOS pede autorização para notificações (só da primeira vez que a app pede)
- runFlow:
    when:
      visible: "Permitir|Allow"
    commands:
      - tapOn: "Permitir|Allow"
- extendedWaitUntil:
    visible: "Tab Bar"
    timeout: 15000
- runFlow: { file: comum/abrir.yaml, env: { ROTA: /perfil/notificacoes } }
# Sem conta, as notificações só explicam onde se ligam os lembretes
- extendedWaitUntil:
    visible: "Os lembretes de cada jogo ligas na página do jogo.*"
    timeout: 10000
- assertNotVisible: "Avisos da malta"
