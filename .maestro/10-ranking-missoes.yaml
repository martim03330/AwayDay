# Jornada 10 — com conta: o Ranking (desafios, divisão, tabela), as tabelas (com os adeptos) e as missões.
appId: host.exp.Exponent
name: 10 Ranking e missões
tags: [com-conta, ranking]
---
- runFlow: comum/entrar-e2e.yaml
- tapOn: "Ranking"
# The tab keeps its stack: go back to the Ranking root if a previous run left a sub-screen open.
- repeat:
    times: 3
    while:
      visible:
        id: "BackButton"
    commands:
      - runFlow: comum/voltar.yaml
- extendedWaitUntil:
    visible: "Desafios da semana|O ranking não carregou"
    timeout: 20000
- assertNotVisible: "O ranking precisa de conta"
- assertNotVisible: "O ranking não carregou"
- assertVisible: "Desafios da semana"

# Missões
- scrollUntilVisible:
    element: "Ver todos os desafios"
    direction: DOWN
- tapOn: "Ver todos os desafios"
- extendedWaitUntil:
    visible: "Desafios da semana"
    timeout: 15000
- assertVisible: "Esta época"
- assertVisible: ".*\\. 0 de 1\\. Mais [0-9]+ pontos\\."
- scrollUntilVisible:
    element: "Conquistas"
    direction: DOWN
- assertNotVisible: "As missões precisam de conta"
- scrollUntilVisible:
    element: "Como se ganham pontos"
    direction: DOWN
- tapOn: "Como se ganham pontos"
- assertVisible: "Esconder"
- tapOn: "Esconder"
- runFlow: comum/voltar.yaml

# Tabelas (with «Adeptos», which used to be «Quem vai à bola»)
- scrollUntilVisible:
    element: "Ver as tabelas"
    direction: DOWN
- tapOn: "Ver as tabelas"
- waitForAnimationToEnd
- assertNotVisible: "As tabelas precisam de conta"
- tapOn: "Adeptos"
- assertVisible: "Estádios com mais adeptos"
- assertVisible:
    id: "BackButton"
- runFlow: comum/voltar.yaml
