# Known starting point for a person without account: signed out, demo off, on the welcome screen.
appId: host.exp.Exponent
---
- runFlow: fechar-modais.yaml
- runFlow: { file: abrir.yaml, env: { ROTA: /perfil } }
- runFlow: concluir-introducao.yaml
- runFlow: sair-do-modo-demo.yaml
- runFlow: terminar-sessao.yaml
- runFlow: { file: abrir.yaml, env: { ROTA: /perfil/definicoes } }
- tapOn: "Rever a introdução"
- extendedWaitUntil:
    visible: "Vamos à bola\\?"
    timeout: 15000
