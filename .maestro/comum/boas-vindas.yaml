# Known starting point for a person without a session: signed out, demo off, on the welcome screen.
appId: host.exp.Exponent
---
- runFlow: fechar-modais.yaml
# Demo mode lets the tabs open without a session: turn it off first.
- runFlow:
    when:
      notVisible: "Vamos à bola\\?"
    commands:
      - runFlow: sair-do-modo-demo.yaml
- runFlow: terminar-sessao.yaml
