# If the app is on the welcome screen or any intro step, gets to the tabs the short way: signs in with the E2E account
# (there is no way in without an account), then «Faço isto depois» on every step and «Agora não» to the notices.
appId: host.exp.Exponent
---
- runFlow: entrar-boas-vindas.yaml
- repeat:
    times: 6
    while:
      visible: "Faço isto depois"
    commands:
      - tapOn: "Faço isto depois"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: "Ligar avisos"
    commands:
      - tapOn: "Agora não"
      - extendedWaitUntil:
          visible: "Tab Bar"
          timeout: 15000
- runFlow:
    when:
      visible: "Juntar à tua conta\\?"
    commands:
      - tapOn: "Agora não"
# The short tour of the tabs shows once after the introduction: skip it.
- runFlow:
    when:
      visible: "Saltar"
    commands:
      - tapOn: "Saltar"
