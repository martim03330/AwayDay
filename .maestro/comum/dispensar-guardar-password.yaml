# iOS offers to save the password after a sign-in attempt: say no (it would cover the app).
appId: host.exp.Exponent
---
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    when:
      visible: "Guardar palavra.passe\\?|Save Password\\?"
    commands:
      - tapOn:
          text: "Agora não|Not Now"
          below: "Guardar palavra.passe\\?|Save Password\\?"
      - waitForAnimationToEnd
