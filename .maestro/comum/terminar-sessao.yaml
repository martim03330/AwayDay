# Signs out if there is a session, and waits for the welcome screen (without a session the app only shows it).
appId: host.exp.Exponent
---
- runFlow:
    when:
      notVisible: "Vamos à bola\\?"
    commands:
      - runFlow: { file: abrir.yaml, env: { ROTA: /perfil } }
      - scrollUntilVisible:
          element: "Terminar sessão"
          direction: DOWN
          timeout: 15000
      - tapOn: "Terminar sessão"
- extendedWaitUntil:
    visible: "Vamos à bola\\?"
    timeout: 15000
