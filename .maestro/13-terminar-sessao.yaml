# Jornada 13 — terminar sessão: a app volta às boas-vindas, que só oferecem criar conta ou entrar. Deixa a app sem
# sessão.
appId: host.exp.Exponent
name: 13 Terminar sessão
tags: [com-conta, conta]
---
- runFlow: comum/entrar-e2e.yaml
- tapOn: "Terminar sessão"
# Without a session the app only shows the welcome screen: no way in without an account.
- extendedWaitUntil:
    visible: "Vamos à bola\\?"
    timeout: 15000
- assertVisible: "Criar conta"
- assertVisible: "Já tenho conta"
- assertNotVisible: "Espreitar sem conta"
- assertNotVisible: "Tab Bar"
