<h2>Mudar a password</h2>
<p>Pediste para mudar a password da tua conta no AwayDay. Escreve este código na app:</p>
<p style="font-size: 28px; font-weight: 700; letter-spacing: 6px;">{{ .Token }}</p>
<p>O código vale durante 1 hora. Se não foste tu a pedir, ignora este email: a tua password fica igual.</p>
